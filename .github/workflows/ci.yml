name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kerkida:kerkida@localhost:5432/kerkida_dev
  BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
  BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-placeholder
  GOOGLE_CLIENT_SECRET: ci-placeholder
  CRON_SECRET: ci-cron-secret

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so origin/main exists for fallow audit (main...HEAD).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      # Use origin/main — checkout does not create a local `main` branch on PRs.
      - name: Fallow audit (changed vs main)
        run: pnpm exec fallow audit --base origin/main --ci --explain

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
